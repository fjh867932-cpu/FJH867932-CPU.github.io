<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>辉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="navbar" class="navbar">
    <button id="nav-back" class="nav-back" title="返回">←</button>
    <span id="nav-title" class="nav-title">辉</span>
    <span class="nav-spacer"></span>
  </nav>
  <main id="view" class="view"></main>

  <template id="tpl-wall">
    <div class="wall">
      <div class="wall-content">
        <div class="wall-bg"></div>
        <div class="notes-layer"></div>
      </div>
      <div class="create-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="vertical-align:-2px;margin-right:4px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>点击此处贴一张便签</div>
      <div class="toolbar collapsed">
        <label class="tool-btn" title="更换背景图片">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>背景</span>
          <input type="file" class="bg-input" accept="image/*" hidden>
        </label>
        <span class="tool-divider"></span>
        <span class="tool-note-count">0 张便签</span>
      </div>
      <div class="float-btns">
        <button class="float-btn float-btn-pan" title="移动/缩放模式"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3"/></svg></button>
        <button class="float-btn float-btn-add" title="添加便签模式"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        <button class="float-btn float-btn-tool" title="展开工具栏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      </div>
    </div>
  </template>

  <template id="tpl-chat">
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages"><div class="chat-empty"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:4px;opacity:.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>有什么学习问题问我？</div></div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" rows="2" placeholder="输入你的问题…"></textarea>
        <button class="chat-send-btn" id="chatSendBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
      </div>
      <div class="chat-status" id="chatStatus"><span>本次：—</span><span>今日：—</span><span>剩余：未知</span></div>
    </div>
  </template>

  <!-- ═══ 记录 ═══ -->
  <template id="tpl-records">
    <div class="page-placeholder">
      <div class="ph-icon">📊</div>
      <h3>记录</h3>
      <p>书籍阅读 · 日常记录 · 时间线回顾 — 更多功能即将上线</p>
    </div>
  </template>

  <!-- ═══ 学习 ═══ -->
  <template id="tpl-learn">
    <div class="page-info">
      <p class="section-title">选择功能</p>
      <div class="info-cards">
        <div class="info-card" data-nav="learn/ask">
          <div class="info-card-dot" style="background:var(--accent)"></div>
          <div class="info-card-body"><h4>学习求助</h4><p>文字 · 图片提问，AI 知识点分析 + 解题思路</p></div>
          <span class="info-card-arrow">›</span>
        </div>
        <div class="info-card" data-nav="learn/mistakes">
          <div class="info-card-dot" style="background:var(--accent-2,#93b5c6)"></div>
          <div class="info-card-body"><h4>错题记录</h4><p>保存历史错题，知识点分类，错题复习</p></div>
          <span class="info-card-arrow">›</span>
        </div>
        <div class="info-card" data-nav="learn/scores">
          <div class="info-card-dot" style="background:var(--accent-3,#b8a9c9)"></div>
          <div class="info-card-body"><h4>成绩记录</h4><p>考试成绩录入，趋势分析，学科强弱</p></div>
          <span class="info-card-arrow">›</span>
        </div>
      </div>
    </div>
  </template>
  <template id="tpl-learn-ask">
    <div class="page-placeholder">
      <div class="ph-icon">💡</div>
      <h3>AI 学习助手</h3>
      <p>向 AI 提问学习问题，支持文字和图片。AI 将给出知识点分析、解题思路和详细讲解。</p>
    </div>
  </template>
  <template id="tpl-learn-mistakes">
    <div class="page-placeholder">
      <div class="ph-icon">✍️</div>
      <h3>错题本</h3>
      <p>保存历史错题，支持图片保存和知识点分类。后续将支持错题复习和统计分析。</p>
    </div>
  </template>
  <template id="tpl-learn-scores">
    <div class="page-placeholder">
      <div class="ph-icon">📈</div>
      <h3>成绩单</h3>
      <p>记录每次考试的成绩，支持单科和总分录入。后续将支持趋势图和学科强弱分析。</p>
    </div>
  </template>

  <!-- ═══ 计划 ═══ -->
  <template id="tpl-plan">
    <div class="page-info">
      <p class="section-title">选择功能</p>
      <div class="info-cards">
        <div class="info-card" data-nav="plan/ai-plan">
          <div class="info-card-dot" style="background:var(--accent)"></div>
          <div class="info-card-body"><h4>AI 计划</h4><p>AI 逐步询问，为你生成可执行的行动计划</p></div>
          <span class="info-card-arrow">›</span>
        </div>
        <div class="info-card" data-nav="plan/canvas">
          <div class="info-card-dot" style="background:var(--accent-2,#93b5c6)"></div>
          <div class="info-card-body"><h4>计划布</h4><p>可视化展示所有已生成的计划</p></div>
          <span class="info-card-arrow">›</span>
        </div>
      </div>
    </div>
  </template>
  <template id="tpl-plan-ai-plan">
    <div class="chat-preset">
      <div class="chat-preset-msg user">
        <div class="chat-preset-avatar user">我</div>
        <div class="chat-preset-bubble user">我想提高高考成绩。</div>
      </div>
      <div class="chat-preset-msg ai">
        <div class="chat-preset-avatar ai">AI</div>
        <div class="chat-preset-bubble ai">
          好的！请补充以下信息：<br><br>
          • 当前年级<br>
          • 当前成绩<br>
          • 目标成绩<br>
          • 每日可投入时间<br>
          • 优势学科<br>
          • 薄弱学科
        </div>
      </div>
    </div>
  </template>
  <template id="tpl-plan-canvas">
    <div class="plan-canvas" id="planCanvas">
      <div class="plan-block" data-nav="plan/detail/1">
        <div class="plan-block-header">
          <span class="plan-block-title">高考冲刺计划</span>
          <span class="plan-block-status">进行中</span>
        </div>
        <div class="plan-block-meta">
          <span>🎯 580 → 650分</span>
          <span>📅 6个月</span>
        </div>
      </div>
      <div class="plan-block" data-nav="plan/detail/2">
        <div class="plan-block-header">
          <span class="plan-block-title">英语提升计划</span>
          <span class="plan-block-status">进行中</span>
        </div>
        <div class="plan-block-meta">
          <span>🎯 110 → 135分</span>
          <span>📅 3个月</span>
        </div>
      </div>
      <div class="plan-block" data-nav="plan/detail/3">
        <div class="plan-block-header">
          <span class="plan-block-title">健身计划</span>
          <span class="plan-block-status">已完成</span>
        </div>
        <div class="plan-block-meta">
          <span>🎯 减脂 5kg</span>
          <span>📅 2个月</span>
        </div>
      </div>
    </div>
  </template>
  <template id="tpl-plan-detail">
    <div class="timeline" id="plan-detail-timeline"></div>
  </template>

  <script src="app.js"></script>
</body>
</html>
